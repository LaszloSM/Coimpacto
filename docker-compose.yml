# Solo para desarrollo local: PostgreSQL igual al de producción (versión mayor).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: credimpacto
      POSTGRES_PASSWORD: credimpacto
      POSTGRES_DB: credimpacto
    ports:
      - "5432:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credimpacto"]
      interval: 5s
      retries: 10

volumes:
  postgres-datos:

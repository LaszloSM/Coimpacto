name: CI

# Minutos de Actions (repo privado, plan gratis de 2.000 min/mes): corre en cada PR y en main,
# no en cada push de rama. Backend, web y contrato tardan ~3 min; Android + Maestro (~30 min)
# solo cuando cambia la app o sus paquetes, o a mano (workflow_dispatch). Lo que solo cambia
# documentación no corre.
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  cambios:
    name: Qué cambió
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filtro.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            app:
              - "movil/**"
              - "packages/**"
              - "package-lock.json"
              - ".github/workflows/ci.yml"

  contrato:
    name: Tokens de diseño y contrato de API al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: npm ci
      - name: tokens.css coincide con DESIGN.md
        run: npm run tokens:check
      - name: Regenerar OpenAPI y tipos del cliente
        env:
          DJANGO_DEBUG: "1"
        run: npm run api:tipos
      - name: Regenerar los casos compartidos de dinero
        run: python3 packages/casos-reglas/scripts/generar_casos.py
      - name: El contrato y los casos commiteados coinciden con su generador
        run: git diff --exit-code -- packages/api-client packages/casos-reglas

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: credimpacto
          POSTGRES_PASSWORD: credimpacto
          POSTGRES_DB: credimpacto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credimpacto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://credimpacto:credimpacto@localhost:5432/credimpacto
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Clave aleatoria solo para esta corrida
        run: echo "DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Sin migraciones pendientes
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Chequeo de despliegue de Django
        run: uv run python manage.py check --deploy --fail-level WARNING
      - run: uv run pytest

  web:
    name: Web y paquetes (reglas + eslint + tsc + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Reglas de dinero en TypeScript (casos compartidos)
        run: npm run test -w @credimpacto/reglas
      - run: npm run typecheck -w @credimpacto/reglas
      - run: npm run lint -w @credimpacto/web
      - run: npm run typecheck -w @credimpacto/web
      - run: npm run test -w @credimpacto/web
      - run: npm run build -w @credimpacto/web

  movil:
    name: App Android (eslint + tsc + jest + APK de release x86_64)
    needs: cambios
    if: needs.cambios.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Un APK tarda ~25 min; si Gradle se cuelga, que falle pronto y no a las 6 horas.
    timeout-minutes: 60
    env:
      CREDIMPACTO_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint -w @credimpacto/movil
      - run: npm run typecheck -w @credimpacto/movil
      - run: npm run test -w @credimpacto/movil
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Generar el proyecto Android (CNG)
        working-directory: movil
        run: npx expo prebuild --platform android --clean --no-install
      - name: Llave desechable (este APK es de modo prueba)
        # Nunca la llave del piloto: un APK de modo prueba firmado con ella se podría instalar
        # encima de la app real en un celular. La del piloto solo la usa apk-piloto.yml.
        run: |
          archivo="$RUNNER_TEMP/desechable.jks"
          clave="$(openssl rand -hex 24)"
          echo "::add-mask::$clave"
          keytool -genkeypair -keystore "$archivo" -storepass "$clave" -keypass "$clave"             -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI desechable" -noprompt
          {
            echo "CREDIMPACTO_FIRMA_ARCHIVO=$archivo"
            echo "CREDIMPACTO_FIRMA_CLAVE=$clave"
            echo "CREDIMPACTO_FIRMA_ALIAS=ci"
            echo "FIRMA=desechable"
          } >> "$GITHUB_ENV"
      - name: APK de release firmado (x86_64, solo para el emulador)
        working-directory: movil/android
        env:
          # Grupo y PIN de muestra para Maestro (src/sesion/modoPrueba.ts). Solo este APK; el
          # AAB para Google Play se construye sin esta variable (TF1).
          EXPO_PUBLIC_MODO_PRUEBA: "1"
        # Solo la arquitectura del emulador: compilar el C++ nativo (quick-crypto, SQLCipher)
        # para dos arquitecturas duplica el tiempo. El AAB para celulares (arm64) lo construye
        # el flujo de publicación (TF1).
        # Sin lint vital de release: falla dentro de dependencias de terceros (masked-view,
        # screens) y no revisa nuestro código. Kotlin en el mismo proceso: así no quedan
        # daemons vivos que dejen el paso colgado después de terminar Gradle.
        run: >-
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          -x lintVitalAnalyzeRelease -Pkotlin.compiler.execution.strategy=in-process
      - run: mv movil/android/app/build/outputs/apk/release/app-release.apk "credimpacto-${FIRMA}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: apk-release
          path: credimpacto-*.apk
          retention-days: 14

  maestro:
    name: E2E Maestro (emulador Android, modo avión)
    needs: movil
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAESTRO_VERSION: "2.11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: apk-release
      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install credimpacto-*.apk
            mkdir -p "$GITHUB_WORKSPACE/maestro-salida"
            maestro test movil/.maestro --exclude-tags=subflujo --format junit --output "$GITHUB_WORKSPACE/maestro-salida/reporte.xml" --debug-output "$GITHUB_WORKSPACE/maestro-salida/depuracion" || { adb logcat -d -v time > "$GITHUB_WORKSPACE/maestro-salida/logcat.txt"; adb logcat -d -v time -s ReactNativeJS:V ReactNative:V AndroidRuntime:E > "$GITHUB_WORKSPACE/maestro-salida/logcat-app.txt"; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-maestro
          path: maestro-salida
          retention-days: 7

  e2e:
    name: E2E Playwright (celular y escritorio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @credimpacto/web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e -w @credimpacto/web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reporte-playwright
          path: web/playwright-report
          retention-days: 7

name: CI

# Corre en cada push a cualquier rama (las ramas de trabajo también quedan verificadas).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  contrato:
    name: Tokens de diseño y contrato de API al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: npm ci
      - name: tokens.css coincide con DESIGN.md
        run: npm run tokens:check
      - name: Regenerar OpenAPI y tipos del cliente
        env:
          DJANGO_DEBUG: "1"
        run: npm run api:tipos
      - name: Regenerar los casos compartidos de dinero
        run: python3 packages/casos-reglas/scripts/generar_casos.py
      - name: El contrato y los casos commiteados coinciden con su generador
        run: git diff --exit-code -- packages/api-client packages/casos-reglas

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: credimpacto
          POSTGRES_PASSWORD: credimpacto
          POSTGRES_DB: credimpacto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credimpacto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://credimpacto:credimpacto@localhost:5432/credimpacto
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Clave aleatoria solo para esta corrida
        run: echo "DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Sin migraciones pendientes
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Chequeo de despliegue de Django
        run: uv run python manage.py check --deploy --fail-level WARNING
      - run: uv run pytest

  web:
    name: Web y paquetes (reglas + eslint + tsc + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Reglas de dinero en TypeScript (casos compartidos)
        run: npm run test -w @credimpacto/reglas
      - run: npm run typecheck -w @credimpacto/reglas
      - run: npm run lint -w @credimpacto/web
      - run: npm run typecheck -w @credimpacto/web
      - run: npm run test -w @credimpacto/web
      - run: npm run build -w @credimpacto/web

  movil:
    name: App Android (eslint + tsc + jest + APK de release x86_64)
    runs-on: ubuntu-latest
    env:
      # La llave de subida vive en secretos de GitHub (EX6, EA3); ver movil/plugins/firma-android.js.
      FIRMA_JKS_BASE64: ${{ secrets.CREDIMPACTO_FIRMA_JKS_BASE64 }}
      CREDIMPACTO_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint -w @credimpacto/movil
      - run: npm run typecheck -w @credimpacto/movil
      - run: npm run test -w @credimpacto/movil
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Generar el proyecto Android (CNG)
        working-directory: movil
        run: npx expo prebuild --platform android --clean --no-install
      - name: Llave de subida (secreto) o llave desechable solo para CI
        env:
          CLAVE: ${{ secrets.CREDIMPACTO_FIRMA_CLAVE }}
          ALIAS: ${{ secrets.CREDIMPACTO_FIRMA_ALIAS }}
          CLAVE_LLAVE: ${{ secrets.CREDIMPACTO_FIRMA_CLAVE_LLAVE }}
        run: |
          archivo="$RUNNER_TEMP/subida.jks"
          if [ -n "$FIRMA_JKS_BASE64" ]; then
            echo "$FIRMA_JKS_BASE64" | base64 -d > "$archivo"
            {
              echo "CREDIMPACTO_FIRMA_CLAVE=$CLAVE"
              echo "CREDIMPACTO_FIRMA_ALIAS=$ALIAS"
              echo "CREDIMPACTO_FIRMA_CLAVE_LLAVE=$CLAVE_LLAVE"
            } >> "$GITHUB_ENV"
            echo "FIRMA=subida" >> "$GITHUB_ENV"
          else
            # Sin secretos (ramas de trabajo, forks): APK solo para el emulador, nunca para celulares.
            clave="$(openssl rand -hex 24)"
            echo "::add-mask::$clave"
            keytool -genkeypair -keystore "$archivo" -storepass "$clave" -keypass "$clave"               -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI desechable" -noprompt
            {
              echo "CREDIMPACTO_FIRMA_CLAVE=$clave"
              echo "CREDIMPACTO_FIRMA_ALIAS=ci"
            } >> "$GITHUB_ENV"
            echo "FIRMA=desechable" >> "$GITHUB_ENV"
          fi
          echo "CREDIMPACTO_FIRMA_ARCHIVO=$archivo" >> "$GITHUB_ENV"
      - name: APK de release firmado (x86_64, solo para el emulador)
        working-directory: movil/android
        env:
          # Grupo y PIN de muestra para Maestro (src/sesion/modoPrueba.ts). Solo este APK; el
          # AAB para Google Play se construye sin esta variable (TF1).
          EXPO_PUBLIC_MODO_PRUEBA: "1"
        # Solo la arquitectura del emulador: compilar el C++ nativo (quick-crypto, SQLCipher)
        # para dos arquitecturas duplica el tiempo. El AAB para celulares (arm64) lo construye
        # el flujo de publicación (TF1).
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - run: mv movil/android/app/build/outputs/apk/release/app-release.apk "credimpacto-${FIRMA}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: apk-release
          path: credimpacto-*.apk
          retention-days: 14

  maestro:
    name: E2E Maestro (emulador Android, modo avión)
    needs: movil
    runs-on: ubuntu-latest
    env:
      MAESTRO_VERSION: "2.11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: apk-release
      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install credimpacto-*.apk
            maestro test movil/.maestro --exclude-tags=subflujo --format junit --output maestro-reporte.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-maestro
          path: |
            maestro-reporte.xml
            ~/.maestro/tests
          retention-days: 7

  e2e:
    name: E2E Playwright (celular y escritorio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @credimpacto/web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e -w @credimpacto/web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reporte-playwright
          path: web/playwright-report
          retention-days: 7

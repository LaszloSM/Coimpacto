name: APK del piloto

# APK para instalar a mano en los celulares de las juntas mientras no haya Google Play
# (docs/operacion/apk-piloto.md). Se lanza a mano: Actions → "APK del piloto" → Run workflow.
# Apunta al servidor de la variable CREDIMPACTO_SERVIDOR y se firma con la llave del piloto
# (secretos CREDIMPACTO_FIRMA_*); queda como pre-lanzamiento para descargarlo en el celular.

on:
  workflow_dispatch:
    inputs:
      notas:
        description: "Qué trae esta versión (aparece en la descarga)"
        required: true

permissions:
  contents: write

concurrency:
  group: apk-piloto
  cancel-in-progress: false

jobs:
  apk:
    name: APK firmado (arm64 y armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_SERVIDOR: ${{ vars.CREDIMPACTO_SERVIDOR }}
      EXPO_PUBLIC_LLAVE_RESPALDO: ${{ vars.CREDIMPACTO_LLAVE_RESPALDO }}
      # Siempre mayor que la versión anterior: Android solo actualiza encima con un número mayor.
      CREDIMPACTO_VERSION_CODE: ${{ github.run_number }}
      FIRMA_P12_BASE64: ${{ secrets.CREDIMPACTO_FIRMA_JKS_BASE64 }}
    steps:
      - name: Todo lo necesario está configurado
        run: |
          falta=""
          [ -n "$EXPO_PUBLIC_SERVIDOR" ] || falta="$falta variable CREDIMPACTO_SERVIDOR;"
          [ -n "$EXPO_PUBLIC_LLAVE_RESPALDO" ] || falta="$falta variable CREDIMPACTO_LLAVE_RESPALDO;"
          [ -n "$FIRMA_P12_BASE64" ] || falta="$falta secreto CREDIMPACTO_FIRMA_JKS_BASE64;"
          case "$EXPO_PUBLIC_SERVIDOR" in https://*|"") ;; *) falta="$falta el servidor debe ser https://;" ;; esac
          if [ -n "${EXPO_PUBLIC_MODO_PRUEBA:-}" ]; then falta="$falta EXPO_PUBLIC_MODO_PRUEBA está definido;"; fi
          if [ -n "$falta" ]; then echo "::error::Falta:$falta"; exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test -w @credimpacto/movil
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Generar el proyecto Android (CNG)
        working-directory: movil
        run: npx expo prebuild --platform android --clean --no-install
      - name: Llave del piloto
        env:
          CLAVE: ${{ secrets.CREDIMPACTO_FIRMA_CLAVE }}
          ALIAS: ${{ secrets.CREDIMPACTO_FIRMA_ALIAS }}
        run: |
          archivo="$RUNNER_TEMP/piloto.p12"
          echo "$FIRMA_P12_BASE64" | base64 -d > "$archivo"
          {
            echo "CREDIMPACTO_FIRMA_ARCHIVO=$archivo"
            echo "CREDIMPACTO_FIRMA_CLAVE=$CLAVE"
            echo "CREDIMPACTO_FIRMA_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"
      - name: APK de release (celulares reales)
        working-directory: movil/android
        run: >-
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -x lintVitalAnalyzeRelease -Pkotlin.compiler.execution.strategy=in-process
      - name: Borrar la llave del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/piloto.p12"
      - name: Nombre y huella
        id: apk
        run: |
          nombre="credimpacto-piloto-v${{ github.run_number }}.apk"
          mv movil/android/app/build/outputs/apk/release/app-release.apk "$nombre"
          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$nombre" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publicar para descargar en el celular
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ inputs.notas }}
        run: |
          printf '%s\n\nServidor: %s\nSHA-256 del APK: %s\n\nInstalar: abrir este enlace en el celular y permitir "instalar apps desconocidas" solo para esta descarga. Una versión nueva se instala encima y conserva los datos; antes, enviar a la Fundación lo pendiente.\n' \
            "$NOTAS" "$EXPO_PUBLIC_SERVIDOR" "${{ steps.apk.outputs.sha256 }}" > notas.md
          gh release create "piloto-v${{ github.run_number }}" "${{ steps.apk.outputs.nombre }}" \
            --title "Piloto v${{ github.run_number }}" --notes-file notas.md --prerelease --target "$GITHUB_SHA"

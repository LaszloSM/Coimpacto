name: Publicar en Google Play (pista interna)

# TF1 (EF1, N6, EA3): cuando CI pasa en main, construye el AAB para celulares (arm64 y armv7),
# firmado con la llave de subida, y lo sube a la pista de prueba interna de Google Play con una
# cuenta de servicio limitada a pistas de prueba. La primera subida es manual en la consola
# (docs/operacion/llaves.md). Sin los secretos, el flujo se salta sin fallar.

# Solo a mano mientras no exista la cuenta de Google Play (TD4): así no arranca un runner en
# cada fusión a main. Cuando esté la cuenta, volver a agregar el disparo tras CI verde en main:
#   workflow_run: { workflows: ["CI"], types: [completed], branches: [main] }
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-play
  cancel-in-progress: false

jobs:
  aab:
    name: AAB firmado para la pista interna
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      FIRMA_JKS_BASE64: ${{ secrets.CREDIMPACTO_FIRMA_JKS_BASE64 }}
      PLAY_JSON: ${{ secrets.PLAY_CUENTA_SERVICIO_JSON }}
      CREDIMPACTO_VERSION_CODE: ${{ github.run_number }}
      EXPO_PUBLIC_SERVIDOR: ${{ vars.CREDIMPACTO_SERVIDOR }}
      EXPO_PUBLIC_LLAVE_RESPALDO: ${{ vars.CREDIMPACTO_LLAVE_RESPALDO }}
    steps:
      - name: ¿Hay llave de subida y cuenta de Play?
        id: listo
        run: |
          if [ -z "$FIRMA_JKS_BASE64" ] || [ -z "$PLAY_JSON" ]; then
            echo "Faltan los secretos de firma o de Play: no se publica (ver docs/operacion/llaves.md)."
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi
      - name: El modo de prueba nunca va a Google Play
        if: steps.listo.outputs.listo == 'si'
        run: |
          if [ -n "${EXPO_PUBLIC_MODO_PRUEBA:-}" ]; then
            echo "::error::EXPO_PUBLIC_MODO_PRUEBA está definido: este build no se publica."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_SERVIDOR" ] || [ -z "$EXPO_PUBLIC_LLAVE_RESPALDO" ]; then
            echo "::error::Faltan las variables CREDIMPACTO_SERVIDOR o CREDIMPACTO_LLAVE_RESPALDO del repositorio."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: steps.listo.outputs.listo == 'si'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        if: steps.listo.outputs.listo == 'si'
        with:
          node-version: "24"
          cache: npm
      - if: steps.listo.outputs.listo == 'si'
        run: npm ci
      - uses: actions/setup-java@v6
        if: steps.listo.outputs.listo == 'si'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.listo.outputs.listo == 'si'
      - name: Generar el proyecto Android (CNG)
        if: steps.listo.outputs.listo == 'si'
        working-directory: movil
        run: npx expo prebuild --platform android --clean --no-install
      - name: Llave de subida desde los secretos
        if: steps.listo.outputs.listo == 'si'
        env:
          CLAVE: ${{ secrets.CREDIMPACTO_FIRMA_CLAVE }}
          ALIAS: ${{ secrets.CREDIMPACTO_FIRMA_ALIAS }}
          CLAVE_LLAVE: ${{ secrets.CREDIMPACTO_FIRMA_CLAVE_LLAVE }}
        run: |
          archivo="$RUNNER_TEMP/subida.jks"
          echo "$FIRMA_JKS_BASE64" | base64 -d > "$archivo"
          {
            echo "CREDIMPACTO_FIRMA_ARCHIVO=$archivo"
            echo "CREDIMPACTO_FIRMA_CLAVE=$CLAVE"
            echo "CREDIMPACTO_FIRMA_ALIAS=$ALIAS"
            echo "CREDIMPACTO_FIRMA_CLAVE_LLAVE=$CLAVE_LLAVE"
          } >> "$GITHUB_ENV"
      - name: AAB de release (arm64 y armv7, para celulares reales)
        if: steps.listo.outputs.listo == 'si'
        working-directory: movil/android
        # Igual que en CI: sin lint vital de terceros y Kotlin en el mismo proceso.
        run: >-
          ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -x lintVitalAnalyzeRelease -Pkotlin.compiler.execution.strategy=in-process
      - name: Subir a la pista de prueba interna
        if: steps.listo.outputs.listo == 'si'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CUENTA_SERVICIO_JSON }}
          packageName: com.coimpactob.credimpacto
          releaseFiles: movil/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - uses: actions/upload-artifact@v7
        if: steps.listo.outputs.listo == 'si'
        with:
          name: aab-play
          path: movil/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

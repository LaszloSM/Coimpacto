[project]
name = "credimpacto-backend"
version = "0.1.0"
description = "Backend de Credimpacto: libro contable de las ACAP (Django + Django Ninja)"
authors = [
    { name = "LaszloSM", email = "LaszloSM@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46",
    "django>=5.2,<6",
    "django-ninja>=1.4",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]

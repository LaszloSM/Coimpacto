# Reunión completa sin señal (TX6, EX3/D23): aportes de los 20, abonos, préstamo con votación y
# firmas agrupadas (D10), arqueo a ciegas que cuadra (D12), cierre firmado con el sello y resumen
# por miembro. Caja: 150.000 de apertura + 20 × 2.000 de fondo social − 100.000 del préstamo.
appId: com.coimpactob.credimpacto
name: Reunión completa sin señal
---
- launchApp:
    clearState: true
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: "perfil-portador_caja"
    timeout: 30000
- tapOn:
    id: "perfil-portador_caja"
- tapOn:
    id: "ir-a-reunion"
- runFlow: pin-cajera.yaml
- extendedWaitUntil:
    visible:
      id: "abrir-reunion"
    timeout: 30000
- tapOn:
    id: "abrir-reunion"
- extendedWaitUntil:
    visible:
      id: "seguir-aportes"
    timeout: 15000
- tapOn:
    id: "seguir-aportes"
- repeat:
    times: 20
    commands:
      - tapOn:
          id: "guardar-siguiente"
- extendedWaitUntil:
    visible: ".*Nadie tiene préstamo vigente..*"
    timeout: 15000
- tapOn:
    id: "seguir-prestamos"
- tapOn:
    id: "agregar-solicitud"
- scrollUntilVisible:
    element:
      id: "pide-9"
- tapOn:
    id: "pide-9"
# En pantallas bajas el teclado no cabe entero bajo la barra de arriba: se trae cada fila a la
# vista antes de tocarla (la del 1 hacia arriba, la del 0 y el 000 hacia abajo).
- scrollUntilVisible:
    element:
      id: "capital-5"
    centerElement: true
- scrollUntilVisible:
    element:
      id: "capital-1"
    direction: UP
    centerElement: true
- tapOn:
    id: "capital-1"
- scrollUntilVisible:
    element:
      id: "capital-000"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "capital-0"
- tapOn:
    id: "capital-0"
- tapOn:
    id: "capital-000"
- assertVisible: ".*cien mil pesos.*"
- scrollUntilVisible:
    element:
      id: "voto-favor-mas"
- repeat:
    times: 12
    commands:
      - tapOn:
          id: "voto-favor-mas"
- scrollUntilVisible:
    element: ".*Aprobado por la asamblea..*"
- tapOn:
    id: "guardar-solicitud"
- tapOn:
    id: "firmar-aprobaciones"
- scrollUntilVisible:
    element:
      id: "firma-presidente"
- tapOn:
    id: "firma-presidente"
- runFlow: pin-presidente.yaml
- extendedWaitUntil:
    visible: ".*Falta 1 firma de 2..*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "firma-portador_caja"
- tapOn:
    id: "firma-portador_caja"
- runFlow: pin-cajera.yaml
- extendedWaitUntil:
    visible: ".*Firmada · entregar el efectivo.*"
    timeout: 30000
- tapOn:
    id: "seguir-arqueo"
- assertVisible: ".*Cuenten los billetes.*"
- tapOn:
    id: "cuenta-50000-mas"
- tapOn:
    id: "cuenta-20000-mas"
- tapOn:
    id: "cuenta-20000-mas"
- tapOn:
    id: "contar-monedas"
- tapOn:
    id: "termine-de-contar"
- assertVisible: ".*Cuadra al peso..*"
- tapOn:
    id: "seguir-cierre"
- tapOn:
    id: "firmar-cierre"
- scrollUntilVisible:
    element:
      id: "firma-presidente"
- tapOn:
    id: "firma-presidente"
- runFlow: pin-presidente.yaml
- extendedWaitUntil:
    visible: ".*Falta 1 firma de 2..*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "firma-portador_caja"
- tapOn:
    id: "firma-portador_caja"
- runFlow: pin-cajera.yaml
- extendedWaitUntil:
    visible:
      id: "reunion-cerrada"
    timeout: 30000
- tapOn:
    id: "ver-resumen"
- assertVisible: "#01"
- repeat:
    times: 19
    commands:
      - tapOn:
          id: "resumen-siguiente"
- tapOn:
    id: "terminar-reunion"
- extendedWaitUntil:
    visible: "¿Quién lleva la reunión?"
    timeout: 15000
- setAirplaneMode: disabled

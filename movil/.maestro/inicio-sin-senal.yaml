# La app abre sin señal (modo avión). En el APK de CI (modo prueba) ya hay dos cargos.
appId: com.coimpactob.credimpacto
name: Inicio sin señal
---
- launchApp:
    clearState: true
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible: "¿Quién lleva la reunión?"
    timeout: 30000
- assertVisible: "Credimpacto"
# La fila del cargo es un solo nodo accesible ("Portador de Caja #02", TD6).
- assertVisible: ".*Portador de Caja.*"
- stopApp
- launchApp
- assertVisible: "¿Quién lleva la reunión?"
- setAirplaneMode: disabled
